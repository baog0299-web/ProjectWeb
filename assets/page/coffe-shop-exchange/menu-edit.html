<!DOCTYPE html>
<html lang = "en">
<meta charset = "UTF-8">
<title>Chỉnh sửa thực đơn</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="menu-edit.css">
<head>
    <style>       
    </style>
</head>
<body>
    <div class = "container">
        <div class = "wrapper">
            <div class = "header">
                <div class = "header-content-bar">
                    <div class = "lang-switcher">
                        <button onclick="changeLang('vi')">Vie</button>
                        <button onclick="changeLang('en')">En</button>
                    </div>
                    <img src="../../image/add-details-page/Component1.svg" alt="Logo" style = "width: 32px; height: 32px;">
                    <div class = "header-content" lang-key="edit_shop">Chỉnh sửa quán: Urban Brew Coffee</div>
                </div>
                <div class = "header-btn">
                    <div class = "btn1" lang-key="cancel">Hủy</div>
                    <div class = "btn2" lang-key="save_changes">Lưu thay đổi</div>
                </div>
            </div>
            <div class = "wrapper-section">
                <div class = "section1">
                    <div class = "list">
                        <a href="general-inform.html" style="text-decoration: none;">
                            <div class = "list-card">
                                <div class = "list-content" lang-key="general_info">Thông tin chung</div>
                            </div>
                        </a>

                        <a href="image-management.html" style="text-decoration: none;">
                            <div class = "list-card">
                                <div class = "list-content" lang-key="manage_images">Quản lí hình ảnh</div>
                            </div>
                        </a>

                        <a href="menu-edit.html" style="text-decoration: none;">
                            <div class = "list-card" style = "background-color: #FEF3C7">
                                <div class = "list-content" lang-key="edit_menu">Chỉnh sửa thực đơn</div>
                            </div>
                        </a>

                        <a href="facility&opening-hour.html" style="text-decoration: none;">
                            <div class = "list-card">
                                <div class = "list-content" lang-key="amenities_hours">Tiện ích & Giờ hoạt động</div>
                            </div>
                        </a>
                    </div>
                </div>
                <div class = "wrapper-section2">
                    <div class="main-container">
                        <div class="menu-container">
                            <div class="sub-title" lang-key="menu_items_title"> Các món trong thực đơn</div>
                                <div class="border-item">
                                            <div class="item-info">
                                                <span class="item-name" lang-key="menu_item_espresso">Cà phê Espresso</span>
                                                <span class="item-describe" lang-key="menu_item_espresso_desc">Đậm đà, hương thơm</span>
                                            </div>
                                            <div class="item-controls">
                                                <span class="item-price">35.000đ</span>
                                                <button class="btn-edit"><i class="fa-solid fa-pen"></i></button>
                                                <button class="btn-delete"><i class="fa-regular fa-trash-can"></i></button>
                                            </div>
                                        </div>
                                        <div class="border-item">
                                            <div class="item-info">
                                            <span class="item-name">Cappuccino</span>
                                                <span class="item-describe" lang-key="menu_item_milk_foam">Bọt sữa mịn</span>
                                            </div>
                                            <div class="item-controls">
                                                <span class="item-price">45.000đ</span>
                                                <button class="btn-edit"><i class="fa-solid fa-pen"></i></button>
                                                <button class="btn-delete"><i class="fa-regular fa-trash-can"></i></button>
                                            </div>
                                        </div>
                                        <div class="border-item">
                                            <div class="item-info">
                                            <span class="item-name">Latte</span>
                                                <span class="item-describe" lang-key="menu_item_light">Nhẹ nhàng</span>
                                            </div>
                                            <div class="item-controls">
                                                <span class="item-price">50.000đ</span>
                                                <button class="btn-edit"><i class="fa-solid fa-pen"></i></button>
                                                <button class="btn-delete"><i class="fa-regular fa-trash-can"></i></button>
                                            </div>
                                        </div>
                                        <div class="border-add-menu">
                                            <div class="item-info">
                                            <span class="item-name" lang-key="add_new_item">Thêm món mới</span>
                                            <div class="input-info">
                                                    <input class="input-border" lang-key="item_name_label" type="text" placeholder="Tên món">
                                                    <input class="input-border" lang-key="item_price_label" placeholder="Giá">
                                                    <button class="btn-add"><i class="fa-solid fa-plus"></i></button>
                                            </div>
                                            </div>
                                        </div>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div> 
    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>


    <script src="lang3.js"></script>
</body>
</html>
