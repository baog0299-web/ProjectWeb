<!DOCTYPE html>
<html lang = "en">
<meta charset = "UTF-8">
<title>Thông tin chung</title>
<link rel="stylesheet" href="general-inform.css">
<head>
    <style>

    </style>
</head>
<body>
    <div class = "container">
        <div class = "wrapper">
            <div class = "header">
                <div class = "header-content-bar">
                    <img src="../../image/add-details-page/Component1.svg" alt="Logo" style = "width: 32px; height: 32px;">
                    <div class = "header-content">Chỉnh sửa quán: Urban Brew Coffee</div>
                </div>
                <div class = "header-btn">
                    <div class = "btn1">Hủy</div>
                    <div class = "btn2">Lưu thay đổi</div>
                </div>
            </div>
            <div class = "wrapper-section">
                <div class = "section1">
                    <div class = "list">
                        <a href="general-inform.html" style="text-decoration: none;">
                            <div class = "list-card" style = "background-color: #FEF3C7">
                                <div class = "list-content">Thông tin chung</div>
                            </div>
                        </a>

                        <a href="image-management.html" style="text-decoration: none;">
                            <div class = "list-card">
                                <div class = "list-content">Quản lí hình ảnh</div>
                            </div>
                        </a>

                        <a href="menu-edit.html" style="text-decoration: none;">
                            <div class = "list-card">
                                <div class = "list-content">Chỉnh sửa thực đơn</div>
                            </div>
                        </a>

                        <a href="facility&opening-hour.html" style="text-decoration: none;">
                            <div class = "list-card">
                                <div class = "list-content">Tiện ích & Giờ hoạt động</div>
                            </div>
                        </a>
                    </div>
                </div>
                <div class = "wrapper-section2">
                        <div class="edit-form">
                            <div class="form-group">
                                <label>Tên quán</label>
                                <input type="text" placeholder="Urban Brew Coffee">
                            </div>

                            <div class="form-group">
                                <label>Địa chỉ</label>
                                <input type="text" placeholder="123 Nguyễn Huệ, Quận 1, TP.HCM">
                                <small>Địa chỉ này sẽ dùng để tạo chỉ đường Google Maps</small>
                            </div>

                            <div class="form-group">
                                <label>Mô tả</label>
                                <textarea rows="2.5" placeholder = "Quán cà phê hiện đại với không gian thoáng mát, view đẹp nhìn ra sông Sài Gòn. Phù hợp cho cả làm việc và gặp gỡ bạn bè.""></textarea>
                                <textarea class="texsie" rows="5" placeholder="Mô tả chi tiết..."></textarea>
                            </div>

                            <div class="form-group">
                                <label>Tags/Từ khoá</label>
                                <div class="tags-container">
                                    <span class="tag">View đẹp <button class="x-btn"><i class="fa-solid fa-xmark"><img src = "../../image/add-details-page/times-sign.svg"></i></button></span>
                                    <span class="tag">Yên tĩnh <button class="x-btn"><i class="fa-solid fa-xmark"><img src = "../../image/add-details-page/times-sign.svg"></i></button></span>
                                    <span class="tag">Wifi nhanh <button class="x-btn"><i class="fa-solid fa-xmark"><img src = "../../image/add-details-page/times-sign.svg"></i></button></span>
                                    <span class="tag">Làm việc <button class="x-btn"><i class="fa-solid fa-xmark"><img src = "../../image/add-details-page/times-sign.svg"></i></button></span>
                                </div>
                                <div class="add-tag">
                                    <input type="text" placeholder="Thêm tag mới...">
                                    <button class="add-btn">Thêm</button>
                                </div>
                            </div>
                        </div>
                </div>
            </div>
        </div>
    </div> 
</body>
</html>
