<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="admin.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="allcode">
    <h2 class="cfadmin">CoffeFinder Admin</h2>
    <img class="picture" src="../../image/thinh/Background+Shadow.png" alt="NO">
     <div class="welcome-container">
        <div class="avatar">A</div>
        <div class="welcome-text">
            <p class="welcome-title">Chào mừng trở lại, ADMIN</p>
            <p class="welcome-subtitle">Quản lý hệ thống quán cafe</p>
    
        </div>
    

    </div>
     <p class="new-prj">Dự án mới</p>
    <div class="main-container">
        <div class="left-column">
            
              
           
            <div class="add-section">
                <button class="add-button">+</button>
                <h3 class="add-title">THÊM</h3>
                <p class="add-subtitle">Thêm quán cafe mới</p>
            </div>
            <div class="recent-section">
                <h3>Recent</h3>
                <div class="recent-items">
                </div>
            </div>
        </div>
        <div class="right-column">
            <div class="note-section">
                <h3>Note:</h3>
                <textarea placeholder="Ghi chú quản trị..."></textarea>
            </div>
            <div class="stats-card">
                 <div class="stats-label">Tổng số quán cafe</div>
                <div class="stats-number">0000</div>
        
                <div class="stats-update">Cập nhật lần cuối: Hôm nay</div>
</body>
</html>
